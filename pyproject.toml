[project]
name = "phoglobushelpers"
version = "0.2.3"
description = "A series of helpers to help the lab with Globus Endpoint related tasks"
authors = [{ name = "Pho Hale", email = "PhoHale@gmail.com" }]
requires-python = ">=3.9,<3.12"
readme = "README.md"
dependencies = [
    "globus-sdk>=3.16.0,<4",
    "globus-cli>=3.13.0,<4",
    "pathlib>=1.0.1,<2",
    "wheel>=0.38.4,<0.39",
    "ipython>=8.11.0,<9",
    "fair-research-login>=0.3.0,<0.4",
    "ipykernel>=6.23.1,<7",
    "pandas>=1.5.1,<2",
    "attrs>=22.1.0,<23",
    "globus-jupyterlab>=1.0.0b10,<2",
    "google-api-python-client>=2.98.0,<3",
    "google-auth-httplib2>=0.1.0,<0.2",
    "google-auth-oauthlib>=1.0.0,<2",
    "watchdog>=5.0.3,<6",
    "globus-compute-sdk>=2.29.0",
    "pyside6>=6.10.3",
    "fusepy>=3.0.1",
]

[dependency-groups]
dev = [
    "setuptools>=67.6.0,<68",
    "wheel>=0.38.4,<0.39",
]

[tool.hatch.build.targets.sdist]
include = ["src/phoglobushelpers"]

[tool.hatch.build.targets.wheel]
include = ["src/phoglobushelpers"]

[tool.hatch.build.targets.wheel.sources]
"src/phoglobushelpers" = "phoglobushelpers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
